server:
  port: 8083

spring:
  datasource:
    url: ${SUPABASE_JDBC_URL}
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 30000
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: false
    properties:
      hibernate:
        default_schema: engagement_schema
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET}
  services:
    access-profile-url: ${ACCESS_PROFILE_SERVICE_URL}
    marketplace-url: ${GIG_MARKETPLACE_SERVICE_URL}
    chat-notification-url: ${CHAT_NOTIFICATION_SERVICE_URL}
    internal-service-token: ${INTERNAL_SERVICE_TOKEN}
SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}

