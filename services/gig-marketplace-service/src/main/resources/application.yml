spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:${SUPABASE_JDBC_URL:jdbc:postgresql://localhost:5432/postgres}}
    username: ${SPRING_DATASOURCE_USERNAME:${SUPABASE_DB_USERNAME:}}
    password: ${SPRING_DATASOURCE_PASSWORD:${SUPABASE_DB_PASSWORD:}}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: marketplace_schema
  sql:
    init:
      mode: always
springdoc:
  swagger-ui:
    path: /swagger-ui.html

resilience4j:
  circuitbreaker:
    instances:
      supabaseStorage:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - java.io.IOException
          - java.net.ConnectException
          - java.net.SocketTimeoutException
          - org.springframework.web.client.RestClientException
          - com.gigu.marketplace.application.exception.SupabaseStorageException
        registerHealthIndicator: true
