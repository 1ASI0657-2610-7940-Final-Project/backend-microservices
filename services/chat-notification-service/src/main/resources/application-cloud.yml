server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 30000
      initialization-fail-timeout: -1
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: none
    defer-datasource-initialization: false
    properties:
      hibernate:
        default_schema: chat_notification_schema
        dialect: org.hibernate.dialect.PostgreSQLDialect
        boot:
          allow_jdbc_metadata_access: false
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET}

SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
GCP_PROJECT_ID: ${GCP_PROJECT_ID}
PUBSUB_CHAT_TOPIC: ${PUBSUB_CHAT_TOPIC}
PUBSUB_PUSH_TOKEN: ${PUBSUB_PUSH_TOKEN}
CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
ACCESS_PROFILE_SERVICE_URL: ${ACCESS_PROFILE_SERVICE_URL}
GIG_MARKETPLACE_SERVICE_URL: ${GIG_MARKETPLACE_SERVICE_URL}
PULLS_SERVICE_URL: ${PULLS_SERVICE_URL}
CHAT_NOTIFICATION_SERVICE_URL: ${CHAT_NOTIFICATION_SERVICE_URL}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
