name: pull-engagement-service

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'services/pull-engagement-service/**'
      - '.github/workflows/pull-engagement-service.yml'
  push:
    branches: [ feature/pull-engagement-service ]
    paths:
      - 'services/pull-engagement-service/**'
      - '.github/workflows/pull-engagement-service.yml'

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/pull-engagement-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn clean verify
