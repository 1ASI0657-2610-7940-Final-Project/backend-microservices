name: gig-marketplace-service

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ feature/gig-marketplace-service ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gig-marketplace-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn clean verify
