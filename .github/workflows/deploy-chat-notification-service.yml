name: Deploy Chat Notification Service (Manual)

on:
  workflow_dispatch:

env:
  GCP_PROJECT_ID: dosys-rest-api
  GCP_REGION: us-central1
  SERVICE_NAME: gigu-chat-notification-service
  SERVICE_SOURCE: services/chat-notification-service
  CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS != '' && vars.CORS_ALLOWED_ORIGINS || 'https://TU-FRONTEND.vercel.app,http://localhost:5173' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "feature/main-app-logic" ]; then
            echo "This workflow only deploys from feature/main-app-logic. Current: ${GITHUB_REF_NAME}"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy to Cloud Run
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INTERNAL_SERVICE_TOKEN: ${{ secrets.INTERNAL_SERVICE_TOKEN }}
        run: |
          cat > env.yaml <<EOF
          SPRING_PROFILES_ACTIVE: cloud
          SPRING_DATASOURCE_URL: "${SPRING_DATASOURCE_URL}"
          SPRING_DATASOURCE_USERNAME: "${SPRING_DATASOURCE_USERNAME}"
          SPRING_DATASOURCE_PASSWORD: "${SPRING_DATASOURCE_PASSWORD}"
          JWT_SECRET: "${JWT_SECRET}"
          INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN}"
          SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN}"
          CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS}"
          EOF
          gcloud run deploy "$SERVICE_NAME" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --source "$SERVICE_SOURCE" \
            --allow-unauthenticated \
            --env-vars-file env.yaml
          gcloud run services describe "$SERVICE_NAME" --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --format='value(status.url)'
